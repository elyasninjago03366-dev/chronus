name: Build Chronus Android for Chromebook

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ۱. کلون کامل به همراه تمام submodules
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      # ۲. اطمینان از دانلود و دریافت کامل تمام ساب‌ماژول‌های زیرمجموعه
      - name: Checkout Nested Submodules
        run: |
          git submodule update --init --recursive --force

      # ۳. نصب جاوا ۱۷
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ۴. نصب SDK و NDK
      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          log-accepted-android-sdk-licenses: true

      - name: Install Specific NDK
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018"

      # ۵. دسترسی اجرا
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # ۶. بیلد برنامه
      - name: Build Standalone Debug APK
        run: ./gradlew :TMessagesProj_AppStandalone:assembleDebug --stacktrace

      # ۷. آپلود خروجی
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chronus-Chromebook-APK
          path: TMessagesProj_AppStandalone/build/outputs/apk/debug/*.apk
