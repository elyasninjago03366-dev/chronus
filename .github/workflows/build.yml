name: Build Chronus Android for Chromebook

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ۱. کلون کامل به همراه تمامی ساب‌ماژول‌ها
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      # ۲. همگام‌سازی و اطمینان از دریافت تمام ساب‌ماژول‌های زیرمجموعه
      - name: Checkout Nested Submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      # ۳. برطرف کردن خودکار خطاهای build.gradle و jlatexmath قبل از بیلد
      - name: Patch Gradle Configurations
        run: |
          # اگر پوشه ساب‌ماژول jlatexmath وجود نداشت، وابستگی اون رو کامنت می‌کنه تا بیلد متوقف نشه
          if [ ! -d "jlatexmath" ] && [ ! -d "TMessagesProj/jlatexmath" ]; then
            echo "jlatexmath directory not found, disabling in TMessagesProj/build.gradle"
            sed -i 's/.*:jlatexmath.*/\/\/ &/g' TMessagesProj/build.gradle || true
            if [ -f "settings.gradle" ]; then
              sed -i 's/.*:jlatexmath.*/\/\/ &/g' settings.gradle || true
            fi
          fi

          # اضافه کردن compileSdk به فایل build.gradle ماژول در صورت عدم وجود
          if ! grep -q "compileSdk" TMessagesProj/build.gradle; then
            echo "Adding compileSdk to TMessagesProj/build.gradle"
            sed -i '/android {/a \\    compileSdk 34' TMessagesProj/build.gradle
          fi

      # ۴. نصب جاوا ۱۷
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ۵. نصب SDK و NDK
      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          log-accepted-android-sdk-licenses: true

      - name: Install Specific NDK
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018"

      # ۶. دسترسی اجرا به فایل gradlew
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # ۷. بیلد برنامه Chronus
      - name: Build Chronus Standalone Debug APK
        run: ./gradlew :TMessagesProj_AppStandalone:assembleDebug --stacktrace

      # ۸. آپلود خروجی APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chronus-Chromebook-APK
          path: TMessagesProj_AppStandalone/build/outputs/apk/debug/*.apk
