workflows:
  android-build:
    name: Build Chronus APK
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      vars:
        PACKAGE_NAME: "org.telegram.messenger"
        GRADLE_OPTS: "-Xmx3072m -Dorg.gradle.daemon=false"

    scripts:
      - name: Set Android SDK & NDK location
        script: | 
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
          echo "ndk.dir=$ANDROID_NDK_ROOT" >> "$CM_BUILD_DIR/local.properties"

      - name: Grant execute permissions for gradlew
        script: | 
          chmod +x gradlew

      - name: Build Android APK
        script: | 
          ./gradlew assembleDebug -x :TMessagesProj_AppTests:generateScheme -x test --stacktrace

    artifacts:
      - app/build/outputs/apk/**/*.apk
      - TMessagesProj/build/outputs/apk/**/*.apk
